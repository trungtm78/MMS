services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: mms_secret
      POSTGRES_DB: mms_db
    ports:
      # Override in the root .env when 5433 is taken by a local PostgreSQL
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms -d mms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Web/backend
      dockerfile: Dockerfile
    env_file: .env.docker
    # Fixed by this topology, so they override .env.docker. nginx is the only proxy: it
    # reaches the backend over the `edge` network from a pinned address and overwrites
    # X-Forwarded-For, so TRUST_PROXY trusts exactly that address. Requests to the
    # published port 3000 (development only) arrive from a Docker gateway, which is not
    # trusted, so a client there cannot choose the address its limits and audit rows use.
    # Redis is the `redis` service.
    environment:
      TRUST_PROXY: ${MMS_NGINX_EDGE_ADDRESS:-10.87.64.10}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3000:3000"
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Web/backend/migrations:/app/migrations:ro

  frontend:
    build:
      context: ./Web/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - edge
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      edge:
        ipv4_address: ${MMS_NGINX_EDGE_ADDRESS:-10.87.64.10}
    depends_on:
      - backend
      - frontend

networks:
  # The request path: nginx, the backend and the frontend. Postgres and Redis stay on
  # `default`, out of nginx's reach. Containers get addresses from the dynamic range only,
  # so nginx's pinned address (outside that range) is never taken. Change the three
  # MMS_EDGE_* / MMS_NGINX_EDGE_ADDRESS settings together in the root .env.
  edge:
    ipam:
      config:
        - subnet: ${MMS_EDGE_SUBNET:-10.87.64.0/24}
          ip_range: ${MMS_EDGE_DYNAMIC_RANGE:-10.87.64.128/25}

volumes:
  postgres_data:
  redis_data:
