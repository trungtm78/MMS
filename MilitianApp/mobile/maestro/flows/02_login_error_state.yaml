appId: ${APP_ID}
tags:
  - auth
  - error-handling

---
# MilitianApp Login — Error State (wrong credentials)

- launchApp

- assertVisible: "Đăng nhập"

- tapOn:
    id: "username_field"
- inputText: "wrong@example.com"

- tapOn:
    id: "password_field"
- inputText: "wrongpassword"

- hideKeyboard
- tapOn: "Đăng nhập"

- waitForAnimationToEnd

- takeScreenshot: 02_login_error

# Must show user-friendly error, NOT raw exception
- assertNotVisible: "e.toString()"
- assertNotVisible: "Exception:"
- assertNotVisible: "DioError"
- assertNotVisible: "SocketException"
- assertNotVisible: "null"

# Must NOT navigate away from login screen
- assertVisible: "Đăng nhập"
