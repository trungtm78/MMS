appId: ${APP_ID}
tags:
  - profile
  - b3

---
# MilitianApp Change Password
# Tests B3 fix: POST /users/me/change-password API call is wired

- runFlow: 01_login_happy_path.yaml

- tapOn: "Cài đặt"
- waitForAnimationToEnd

- tapOn: "Đổi mật khẩu"
- waitForAnimationToEnd

- takeScreenshot: 09_change_password_screen

- tapOn:
    id: "current_password_field"
- inputText: "${TEST_PASSWORD}"

- tapOn:
    id: "new_password_field"
- inputText: "NewPassword@123"

- tapOn:
    id: "confirm_password_field"
- inputText: "NewPassword@123"

- hideKeyboard

- tapOn: "Lưu"
- waitForAnimationToEnd

- takeScreenshot: 09_after_change

# Change password button must call API — no silent failure
- assertNotVisible: "Exception:"

# Restore original password for subsequent test runs
- tapOn: "Đổi mật khẩu"
- waitForAnimationToEnd
- tapOn:
    id: "current_password_field"
- inputText: "NewPassword@123"
- tapOn:
    id: "new_password_field"
- inputText: "${TEST_PASSWORD}"
- tapOn:
    id: "confirm_password_field"
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Lưu"
- waitForAnimationToEnd
