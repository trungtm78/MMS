upstream mms_backend {
    server backend:3000;
    keepalive 64;
}

# nginx is the edge proxy. It states the client address itself (X-Forwarded-For and
# X-Real-IP set to $remote_addr) and discards whatever a client sent in those headers,
# so a client cannot pick the address its rate limits, sessions and audit rows use. The
# backend accepts the header only from this nginx: the compose files pin nginx's address
# on the `edge` network (MMS_NGINX_EDGE_ADDRESS) and set TRUST_PROXY to exactly that.
#
# A further proxy or load balancer in front of this nginx must change this together with
# TRUST_PROXY: either restore the real client into $remote_addr here with the realip
# module (set_real_ip_from <outer proxy>; real_ip_header X-Forwarded-For;), or forward
# the chain with $proxy_add_x_forwarded_for and add the outer proxy to TRUST_PROXY.
# Changing only one side throttles every client as the outer proxy's address, or lets
# clients forge their address.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # API
    location /api/ {
        proxy_pass http://mms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Overwrite, never append, client-supplied values (see the note above)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://mms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Overwrite, never append, client-supplied values (see the note above)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # React SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
