services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: ${REGISTRY}/mms-backend:${IMAGE_TAG:-latest}
    env_file: .env.docker
    # Fixed by this topology, so they override .env.docker. nginx is the only way in: it
    # reaches the replicas over the `edge` network from a pinned address and overwrites
    # X-Forwarded-For, so TRUST_PROXY trusts exactly that address. The replicas must share
    # rate-limit counters and Socket.IO events through the `redis` service, authenticating
    # with the password it is started with.
    environment:
      TRUST_PROXY: ${MMS_NGINX_EDGE_ADDRESS:-10.87.64.10}
      THROTTLE_STORAGE: redis
      SOCKET_ADAPTER: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env}
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure

  # The single-page app; nginx proxies every path outside /api and /socket.io to it
  frontend:
    image: ${REGISTRY}/mms-frontend:${IMAGE_TAG:-latest}
    networks:
      - edge
    deploy:
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      edge:
        ipv4_address: ${MMS_NGINX_EDGE_ADDRESS:-10.87.64.10}
    depends_on:
      - backend
      - frontend

networks:
  # The request path: nginx, the backend replicas and the frontend. Postgres and Redis stay
  # on `default`, out of nginx's reach. Containers get addresses from the dynamic range
  # only, so nginx's pinned address (outside that range) is never taken. Change the three
  # MMS_EDGE_* / MMS_NGINX_EDGE_ADDRESS settings together in the root .env.
  edge:
    ipam:
      config:
        - subnet: ${MMS_EDGE_SUBNET:-10.87.64.0/24}
          ip_range: ${MMS_EDGE_DYNAMIC_RANGE:-10.87.64.128/25}

volumes:
  postgres_data:
  redis_data:
