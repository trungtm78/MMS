name: police_app
description: Ứng dụng quản lý DQTV cho CA khu vực — PoliceApp
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Vietnamese UI texts: gen-l10n from lib/l10n/app_vi.arb (l10n.yaml)
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & Networking
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.2.0

  # Location / GPS
  geolocator: ^11.0.0

  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Image
  image_picker: ^1.0.7

  # MFA enrolment: QR code for the otpauth URI and opening the authenticator app
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  # Sharing recovery codes
  share_plus: ^7.2.2

  # Utilities
  # flutter_localizations pins intl 0.20.2
  intl: ^0.20.2
  permission_handler: ^11.2.0
  web_socket_channel: ^2.4.0
  just_audio: ^0.9.37

  # UI
  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # The Công an nhân dân badge (shared/widgets/app_logo.dart)
    - assets/images/logo_ca.png
