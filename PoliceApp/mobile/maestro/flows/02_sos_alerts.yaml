appId: ${POLICE_APP_ID}
tags:
  - critical
  - c1
  - sos

---
# PoliceApp SOS/Alerts List
# Tests C1 fix: /alerts → /sos endpoint
# Tests C1 fix: POST /alerts/:id/resolve → PATCH /sos/:id/status

- runFlow: 01_login_ca.yaml

- tapOn: "Cảnh báo"
- waitForAnimationToEnd

- takeScreenshot: 02_sos_list

# Must load — no 404 from old /alerts endpoint
- assertNotVisible: "404"
- assertNotVisible: "Not Found"
- assertNotVisible: "Exception:"
- assertNotVisible: "null"

# Open first SOS alert and resolve it
- tapOn:
    index: 0
- waitForAnimationToEnd

- takeScreenshot: 02_sos_detail

- tapOn: "Xử lý"
- waitForAnimationToEnd

- takeScreenshot: 02_sos_resolve_dialog

- tapOn: "Xác nhận"
- waitForAnimationToEnd

- takeScreenshot: 02_sos_resolved

# Must succeed — PATCH to /sos/:id/status not POST to /alerts/:id/resolve
- assertNotVisible: "405"
- assertNotVisible: "Method Not Allowed"
- assertNotVisible: "Exception:"
